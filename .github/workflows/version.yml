name: Auto Version & Tag

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ closed ]
    branches: [ main ]

jobs:
  version-and-tag:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Get current version
      id: current_version
      run: |
        CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $CURRENT_VERSION"
    
    - name: Check if version bump is needed
      id: version_check
      run: |
        # Get all tags and find the highest version
        ALL_TAGS=$(git tag -l "v*" | sort -V | tail -1)
        CURRENT_VERSION="${{ steps.current_version.outputs.current_version }}"
        
        echo "All tags: $(git tag -l 'v*' | sort -V)"
        echo "Highest tag: $ALL_TAGS"
        echo "Current pubspec version: $CURRENT_VERSION"
        
        if [ -z "$ALL_TAGS" ]; then
          echo "No previous tags found, will create first tag"
          echo "should_bump=true" >> $GITHUB_OUTPUT
          echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        else
          # Remove 'v' prefix if present
          LATEST_TAG_CLEAN=${ALL_TAGS#v}
          
          echo "Latest tag: $LATEST_TAG_CLEAN"
          
          # Always create a new patch version for code changes
          echo "Creating patch increment from latest tag"
          echo "should_bump=true" >> $GITHUB_OUTPUT
          
          # Extract version parts from latest tag
          IFS='.' read -r major minor patch <<< "$LATEST_TAG_CLEAN"
          NEW_PATCH=$((patch + 1))
          NEW_VERSION="$major.$minor.$NEW_PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Creating patch version: $NEW_VERSION"
        fi
    
    - name: Create and push tag
      if: steps.version_check.outputs.should_bump == 'true'
      run: |
        NEW_VERSION="${{ steps.version_check.outputs.new_version }}"
        TAG_NAME="v$NEW_VERSION"
        
        echo "Creating tag: $TAG_NAME"
        
        # Create the tag
        git tag -a "$TAG_NAME" -m "Release version $NEW_VERSION"
        
        # Push the tag
        git push origin "$TAG_NAME"
        
        echo "Tag $TAG_NAME created and pushed successfully"
    
    - name: Create GitHub Release
      if: steps.version_check.outputs.should_bump == 'true'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version_check.outputs.new_version }}
        release_name: Release v${{ steps.version_check.outputs.new_version }}
        body: |
          ## Changes in v${{ steps.version_check.outputs.new_version }}
          
          This release includes the latest changes from the main branch.
          
          ### Installation
          ```yaml
          dependencies:
            xterm: ^${{ steps.version_check.outputs.new_version }}
          ```
          
          ### Usage
          ```dart
          import 'package:xterm/xterm.dart';
          ```
        draft: false
        prerelease: false
